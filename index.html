<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yueheng Fu</title>
    <meta
      name="description"
      content="Yueheng Fu, a first-year Systems Design Engineering student at the University of Waterloo. Experience, projects and contact."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Yueheng Fu" />
    <meta
      property="og:description"
      content="First-year Systems Design Engineering student at the University of Waterloo."
    />
    <meta property="og:url" content="https://fuyueheng.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0d0d0c" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="%BASE_URL%fonts/ibm-plex-sans-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Self-hosted IBM Plex (latin subset, SIL OFL). Declared here so the
         font URLs and the preload above share one base-relative address,
         which also works under a GitHub Pages subpath. */
      @font-face {
        font-family: 'IBM Plex Sans';
        src: url('%BASE_URL%fonts/ibm-plex-sans-latin-wght-normal.woff2') format('woff2-variations');
        font-weight: 100 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        src: url('%BASE_URL%fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <script>
      // Pick the theme before first paint: a saved choice, else the system
      // setting, else dark.
      ;(function () {
        var t
        try {
          t = localStorage.getItem('theme')
        } catch (e) {
          // storage blocked
        }
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.setAttribute('data-theme', t)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'light' ? '#f3f1ec' : '#0d0d0c')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
